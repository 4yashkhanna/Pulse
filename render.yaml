databases:
  - name: pulse-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: pulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PULSE_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: CHAT_MODEL
        value: gemini-3.5-flash
      - key: TAG_MODEL
        value: gemini-3.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: CONNECTIONS_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
      - key: BACKEND_BASE_URL
        sync: false
