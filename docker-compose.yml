# Local Postgres + pgvector for prototype development.
# The schema is applied automatically on first boot via docker-entrypoint-initdb.d.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pulse-db
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pulse_pgdata:
